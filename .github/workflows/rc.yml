name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Set RC version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          BASE_VERSION="${LATEST_TAG#v}"
          BASE_VERSION="${BASE_VERSION%%-*}"
          RC_VERSION="${BASE_VERSION}-rc.${GITHUB_RUN_NUMBER}"
          npm version "$RC_VERSION" --no-git-tag-version
          echo "version=${RC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack tarball
        run: npm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL=$(ls *.tgz)
          NOTES=$(printf 'Release candidate - install with:\n```\nnpm install https://github.com/%s/releases/download/v%s/%s\n```' "${{ github.repository }}" "$VERSION" "$TARBALL")
          gh release create "v${VERSION}" "$TARBALL" \
            --title "v${VERSION}" \
            --prerelease \
            --notes "$NOTES"
